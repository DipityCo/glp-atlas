[package]
name = "glp-atlas"
version = "0.1.0"
edition = "2021"
description = "GLP Atlas: a GLP-1 dose and progress tracker"
license = "AGPL-3.0-or-later"

[lints.clippy]
all = "warn"
cargo = "warn"
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"
cargo_common_metadata = { level = "allow", priority = 127 }
collapsible_if = { level = "allow", priority = 127 }
multiple_crate_versions = { level = "allow", priority = 127 }
needless_continue = { level = "allow", priority = 127 }
str_to_string = { level = "deny", priority = 127 }
uninlined-format-args = { level = "allow", priority = 127 }

[lints.rust]
let_underscore_drop = { level = "deny", priority = 127 }
non_ascii_idents = { level = "deny", priority = 127 }

[dependencies]
dioxus = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For `StreamExt::next` on the channel behind `use_coroutine`, which dioxus re-exports the ends of
# but not the trait to read them with. Already in the tree under dioxus.
futures-util = { version = "0.3", default-features = false }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = "0.15"
