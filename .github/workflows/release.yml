name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-pr:
    name: Update the release PR
    runs-on: ubuntu-latest
    if: github.repository == 'DipityCo/glp-atlas'
    concurrency:
      group: release-pr-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release:
    name: Tag and draft the release
    runs-on: ubuntu-latest
    if: github.repository == 'DipityCo/glp-atlas'
    concurrency:
      group: release
      queue: max
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read the release tag
        id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[0].tag // empty' <<<"$RELEASES")
          [ -n "$tag" ] || { echo "released, but no tag in $RELEASES" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  apk:
    name: Package the release APK
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/android.yml
    with:
      release: true

  attach:
    name: Attach the APK
    needs: [release, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.apk.outputs.artifact }}
          path: apk

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" apk/*.apk --clobber
